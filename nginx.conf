server {
    listen 80;
    server_name shoes.mo-magdy.com;
    root /var/www/html/public;

    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Serve storage and static assets BEFORE hitting Laravel
    location /storage/ {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
        expires max;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|webp|svg|woff|woff2|ttf|otf)$ {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
        expires max;
    }

    # Main Laravel handler
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass shoes:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Block hidden files, except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
