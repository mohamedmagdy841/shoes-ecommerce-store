services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoes
    networks:
      - custom-network
    restart: always
    env_file:
      - .env
    volumes:
      - .:/var/www/html 

  shoes_nginx:
    image: nginx:1.29.0-alpine
    container_name: shoes_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - custom-network
    restart: always

networks:
  custom-network:
    external: true
