services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoes
    volumes:
      - storage_data:/var/www/html/storage/app/public   # <-- Only share public storage
    networks:
      - custom-network
    restart: always
    env_file:
      - .env

  shoes_nginx:
    image: nginx:1.29.0-alpine
    container_name: shoes_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage/app/public
      - ./public:/var/www/html/public
    depends_on:
      - app
    networks:
      - custom-network
    restart: always

networks:
  custom-network:
    external: true
